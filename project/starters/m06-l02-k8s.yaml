# Starter Lab 6.2: Kubernetes-Manifest mit Lücken. Kopieren nach playground/k8s.yaml.
# Validieren:  kubectl apply --dry-run=client --validate=false -f playground/k8s.yaml  (braucht je nach Version einen erreichbaren Cluster)
#              oder kubeconform -strict -summary playground/k8s.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vantra-ops-config
data:
  MCP_TRANSPORT: streamable-http
  MCP_HOST: 0.0.0.0
  MCP_PORT: "8000"
  # TODO(Aufgabe 1): MOCK_API_URL und TOOL_CALL_LOG (/data/tool_calls.jsonl) ergänzen; Rolle viewer als Standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vantra-ops-mcp
  labels:
    app: vantra-ops-mcp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vantra-ops-mcp
  template:
    metadata:
      labels:
        app: vantra-ops-mcp
    spec:
      containers:
        - name: mcp-server
          image: vantra-ops-mcp:1.0.0
          ports:
            - name: mcp
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vantra-ops-config
          # TODO(Aufgabe 2): Secret per secretKeyRef einbinden (Secret vantra-ops-secrets, Schlüssel MOCK_API_TOKEN, optional)
          # TODO(Aufgabe 3): readinessProbe und livenessProbe auf GET /health (Port mcp) ergänzen
          # TODO(Aufgabe 4): securityContext: nicht als root, keine Rechteausweitung, Dateisystem schreibgeschützt;
          #   dafür emptyDir auf /data mounten
          # TODO(Aufgabe 5): resources (requests und limits) setzen
---
# TODO(Aufgabe 6): Service vom Typ ClusterIP für app=vantra-ops-mcp auf Port 8000 ergänzen
