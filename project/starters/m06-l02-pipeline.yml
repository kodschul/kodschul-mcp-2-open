# Pipeline-Skizze – Starter (Lab 6.2, Teil B)
# Kopieren nach playground/pipeline.yml. GitHub-Actions-Syntax; wird nicht ausgeführt, nur skizziert.
# Gerüst der fünf Jobs ist vorgegeben (runs-on, checkout); zu ergänzen sind die markierten Schritte.
# Vorlage für build und test: Theorie Lab 6.2, Abschnitt „Ausgearbeitetes Beispiel“.
